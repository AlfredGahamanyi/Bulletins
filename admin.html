<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17365d">
<meta name="robots" content="noindex">
<title>Administration · Bulletins scolaires</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<style>
  body{padding-bottom:24px}
  main{max-width:760px}
  a.carte{cursor:pointer}
  .retour{display:inline-block;margin:0 0 10px;color:var(--encre);font-weight:600;text-decoration:none}
  .tableau{overflow-x:auto;border:1px solid var(--trait);border-radius:var(--r);background:var(--blanc);margin:8px 0 12px}
  .tableau table{border-collapse:collapse;width:100%;font-size:14.5px}
  .tableau th,.tableau td{padding:7px 10px;border-bottom:1px solid var(--trait);text-align:left;white-space:nowrap}
  .tableau th{background:var(--fond);color:var(--doux);font-size:13px;position:sticky;top:0}
  .tableau td.num,.tableau th.num{text-align:right;font-variant-numeric:tabular-nums}
  .tableau td.nc{color:var(--alerte);font-weight:600}
  .grille{display:grid;gap:8px;grid-template-columns:1fr 1fr}
  @media (max-width:520px){.grille{grid-template-columns:1fr}}
  .grille .btn{margin:0}
  select{margin:4px 0 8px}
  .tableau tr.sous td{font-style:italic;background:var(--fond)}
  .tableau tr.tot td{font-weight:700;background:#dde5f0}
  .tableau tr.sect td{font-weight:700;background:#dde5f0}
  .tableau thead th{text-align:center}
  .tableau td.num{text-align:center}
  .abs input{width:64px;min-height:36px;margin:2px;text-align:center}
  .live{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:6px}
</style>
</head>
<body>
<div id="app"><p class="vide">Chargement…</p></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="moteur.js"></script>
<script src="etablissement.js"></script>
<script src="bulletin_css.js"></script>
<script src="bulletin_css_domaines.js"></script>
<script src="bulletin_css_etat.js"></script>
<script src="bulletin_css_cartouche.js"></script>
<script src="bulletin.js"></script>
<script src="pdfmini.js"></script>
<script src="tableaux.js"></script>
<script src="acces.js"></script>
<script src="auth.js"></script>
<script src="firebase-config.js"></script>
<script src="synchro.js"></script>
<script src="admin.js"></script>
</body>
</html>
